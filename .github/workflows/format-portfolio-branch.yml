name: Format portfolio redesign branch
on:
  push:
    branches:
      - redesign/liquid-glass-portfolio

permissions:
  contents: write

concurrency:
  group: liquid-glass-autoformat
  cancel-in-progress: true

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip-autoformat]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: composer format
      - run: npm run format
      - name: Commit format-only changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app routes database tests resources/js resources/css
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Pint and Prettier [skip-autoformat]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
